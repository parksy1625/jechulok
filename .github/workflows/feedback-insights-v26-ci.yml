name: JeChulOK v2.6 Insights Audit
on:
  push:
    paths:
      - '.agents/skills/jechulok-submission/**'
      - '.github/workflows/feedback-insights-v26-ci.yml'
  pull_request:
    paths:
      - '.agents/skills/jechulok-submission/**'
      - '.github/workflows/feedback-insights-v26-ci.yml'
permissions:
  contents: read
jobs:
  synthetic-feedback-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check opt-in feedback priority and cohort comparisons
        working-directory: .agents/skills/jechulok-submission
        run: python scripts/feedback_insights_audit_v26.py --check > insights-v26.json
      - name: Upload synthetic v2.6 quality comparison report
        uses: actions/upload-artifact@v4
        with:
          name: jechulok-v26-feedback-insights-synthetic
          path: .agents/skills/jechulok-submission/insights-v26.json
          if-no-files-found: error
          retention-days: 30
