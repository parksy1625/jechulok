name: JeChulOK v3.1 Offline Synthetic Rehearsal Audit
on:
  push:
    paths:
      - '.agents/skills/jechulok-submission/**'
      - '.github/workflows/offline-demo-v31-ci.yml'
  pull_request:
    paths:
      - '.agents/skills/jechulok-submission/**'
      - '.github/workflows/offline-demo-v31-ci.yml'
permissions:
  contents: read
jobs:
  offline-rehearsal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local processing dependencies
        working-directory: .agents/skills/jechulok-submission
        run: python -m pip install -r requirements.txt
      - name: Six synthetic scenarios (opt-in inside test runner)
        working-directory: .agents/skills/jechulok-submission
        run: python scripts/offline_demo_audit_v31.py --check > offline-v31.json
      - name: Verify synthetic-only limits
        working-directory: .agents/skills/jechulok-submission
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('offline-v31.json').read_text())
          assert data['status'] == 'pass', data
          assert data['scenario_count'] == data['passed_count'] == 6
          assert data['synthetic_only'] is True
          assert data['real_user_documents_tested'] is False
          assert data['client_configs_accessed'] is False
          assert data['network_used'] is False
          assert data['outputs_persisted'] is False
          assert data['external_submission_tested'] is False
          PY
      - name: Upload synthetic-only report
        uses: actions/upload-artifact@v4
        with:
          name: jechulok-v31-offline-synthetic
          path: .agents/skills/jechulok-submission/offline-v31.json
          if-no-files-found: error
          retention-days: 30
