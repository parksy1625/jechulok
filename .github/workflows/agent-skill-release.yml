name: JeChulOK Agent Skill Release v2.1
on:
  push:
    tags:
      - 'v2.1.0'
permissions:
  contents: read
concurrency:
  group: jechulok-agent-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    name: Verify tagged source and publish checked artifacts
    if: startsWith(github.ref, 'refs/tags/v2.1.0')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify version and install dependencies
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          test "$(cat VERSION)" = "2.0.0"
          python -m pip install -r requirements-mcp.txt
          python -m pip check
      - name: Release gate — full tests and safe archive
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          mkdir -p "$RUNNER_TEMP/jechulok-release"
          python scripts/release_v20.py build --output-dir "$RUNNER_TEMP/jechulok-release"
          python scripts/release_v20.py verify --archive "$RUNNER_TEMP/jechulok-release/jechulok-agent-skill-v2.1.0.zip"
          cd "$RUNNER_TEMP/jechulok-release"
          sha256sum -c jechulok-agent-skill-v2.1.0.sha256
      - name: Publish only for the explicitly created v2.1.0 Git tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/jechulok-release/jechulok-agent-skill-v2.1.0.zip" \
            "$RUNNER_TEMP/jechulok-release/jechulok-agent-skill-v2.1.0.sha256" \
            --verify-tag \
            --title "JeChulOK Agent Skill v2.1.0" \
            --notes-file .agents/skills/jechulok-submission/RELEASE_NOTES_v21.md
