name: JeChulOK Agent Skill CI
on:
  push:
    paths:
      - '.agents/skills/jechulok-submission/**'
      - '.github/workflows/agent-skill-ci.yml'
  pull_request:
    paths:
      - '.agents/skills/jechulok-submission/**'
      - '.github/workflows/agent-skill-ci.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-release
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: .agents/skills/jechulok-submission
        run: python -m pip install -r requirements-mcp.txt
      - name: Verify dependency compatibility
        working-directory: .agents/skills/jechulok-submission
        run: python -m pip check
      - name: Compile source and tests
        working-directory: .agents/skills/jechulok-submission
        run: python -m compileall -q scripts tests
      - name: Run CLI + MCP + end-to-end release tests
        working-directory: .agents/skills/jechulok-submission
        run: python -m unittest discover -s tests -v
      - name: Build and verify v2.5 portable Agent Skill ZIP (Linux 3.11)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/jechulok-v25"
          python scripts/release_v20.py build --output-dir "$RUNNER_TEMP/jechulok-v25"
          python scripts/release_v20.py verify --archive "$RUNNER_TEMP/jechulok-v25/jechulok-agent-skill-v2.5.0.zip"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "jechulok-v25"
          assert (root / "jechulok-agent-skill-v2.5.0.zip").is_file()
          assert (root / "jechulok-agent-skill-v2.5.0.sha256").is_file()
          print("Portable v2.5 release built and verified")
          PY
      - name: Upload portable v2.5 Agent Skill release candidate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: jechulok-agent-skill-v2.5.0
          path: ${{ runner.temp }}/jechulok-v25/*
          if-no-files-found: error
          retention-days: 30
      - name: Verify offline update and version consistency (all platforms)
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          outcome = subprocess.run([
              sys.executable, "scripts/setup_mcp.py", "updates",
              "--allowed-dir", str(Path.cwd().resolve())
          ], capture_output=True, text=True, check=True)
          result = json.loads(outcome.stdout)
          assert result["current_version"] == "2.5.0"
          assert result["status"] == "offline"
          assert not result["download_performed"]
          print("v2.5 offline update check OK")
          PY
      - name: Accessible v2.3 guide is read-only and never probes automatically
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          here = str(Path.cwd().resolve())
          result = subprocess.run([
              sys.executable, "scripts/setup_mcp.py", "guide",
              "--allowed-dir", here, "--language", "en", "--format", "json"
          ], capture_output=True, text=True, check=True)
          report = json.loads(result.stdout)
          assert report["status"] == "needs_setup", report
          assert not report["network_used"]
          assert not report["command_executed"]
          assert not report["original_documents_read"]
          assert not report["client_config_modified"]
          assert here not in result.stdout
          print("v2.3 accessible no-write guide OK")
          PY
      - name: v2.3 recovery lifecycle — 14 synthetic scenarios and real extracted MCP (Linux 3.11)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python scripts/recovery_scenarios_v23.py --check > "$RUNNER_TEMP/jechulok-recovery-v23.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "jechulok-recovery-v23.json").read_text())
          assert report["status"] == "pass", report
          assert report["scenario_count"] == 14
          assert report["passed_count"] == 14
          assert report["real_stdio_handshake_tested"]
          assert not report["actual_user_installation_tested"]
          assert not report["user_client_settings_changed"]
          assert not report["user_data_processed"]
          print("v2.3 synthetic recovery cycle passed")
          PY
      - name: Upload synthetic v2.3 recovery audit JSON
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: jechulok-recovery-v23-synthetic-only
          path: ${{ runner.temp }}/jechulok-recovery-v23.json
          if-no-files-found: error
          retention-days: 30
      - name: v2.4 first-run usability regression (24 synthetic guided states)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python scripts/first_run_audit_v24.py --check > "$RUNNER_TEMP/jechulok-first-run-v24.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "jechulok-first-run-v24.json").read_text())
          assert report["status"] == "pass", report
          assert report["scenario_count"] == 24
          assert report["passed_count"] == 24
          assert report["one_grouped_question_per_case"] == 6
          assert report["human_testers"] == 0
          assert report["observed_user_question_count"] is None
          assert report["counterfactual_is_not_observed_behavior"]
          assert not report["real_personal_documents_read"]
          assert not report["jobs_started"]
          assert not report["outputs_created"]
          print("24 synthetic v2.4 UX states passed")
          PY
      - name: Upload v2.4 synthetic first-run UX evaluation
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: jechulok-first-run-v24-synthetic
          path: ${{ runner.temp }}/jechulok-first-run-v24.json
          if-no-files-found: error
          retention-days: 30
      - name: v2.5 synthetic opt-in feedback and privacy aggregate regression
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python scripts/feedback_audit_v25.py --check > "$RUNNER_TEMP/jechulok-feedback-v25.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "jechulok-feedback-v25.json").read_text())
          assert report["status"] == "pass", report
          assert report["scenario_count"] == 31
          assert report["passed_cases"] == 31
          assert report["participants"] == 0
          assert report["actual_feedback_collected"] is False
          assert report["actual_user_satisfaction"] is None
          assert report["telemetry_sent"] is False
          assert report["automatic_upload"] is False
          assert report["existing_user_files_changed"] is False
          print("v2.5: synthetic feedback privacy regression passed")
          PY
      - name: Upload synthetic-only v2.5 feedback audit JSON
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: jechulok-feedback-v25-synthetic
          path: ${{ runner.temp }}/jechulok-feedback-v25.json
          if-no-files-found: error
          retention-days: 30
      - name: Evaluate 100 synthetic guidance scenarios (Linux 3.11)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python scripts/evaluate_v18.py --check > "$RUNNER_TEMP/jechulok-eval-v18.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "jechulok-eval-v18.json").read_text())
          assert data["dataset_type"] == "synthetic_only"
          assert data["evaluated_cases"] == 100
          assert data["distinct_synthetic_notices"] == 100
          assert data["passed_cases"] == 100, data["failures"]
          assert len(data["families"]) == 4
          assert data["real_world_accuracy"] is None
          print("100 synthetic cases passed; no real-world accuracy claims")
          PY
      - name: Upload inspectable v1.8 evaluation JSON
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: jechulok-eval-v18-synthetic
          path: ${{ runner.temp }}/jechulok-eval-v18.json
          if-no-files-found: error
          retention-days: 30
      - name: v1.9 independent-label evaluator public synthetic example (Linux 3.11)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python scripts/evaluate_real_v19.py tests/fixtures/v19_example_synthetic.jsonl --strict > "$RUNNER_TEMP/jechulok-eval-v19-example.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "jechulok-eval-v19-example.json").read_text())
          assert data["status"] == "evaluated", data
          assert data["dataset_type"] == "user_provided_reviewed_notices"
          assert data["cases_total"] == 4
          assert data["unresolved_cases"] == 0
          assert data["metrics"]["field_value_recall"] == 1.0
          assert data["metrics"]["unsafe_accept_rate"] == 0
          assert "notices" not in data
          print("Local evaluation engine synthetic example smoke OK")
          PY
      - name: Upload v1.9 PUBLIC SYNTHETIC sample report only
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: jechulok-v19-example-synthetic-only
          path: ${{ runner.temp }}/jechulok-eval-v19-example.json
          if-no-files-found: error
          retention-days: 30
      - name: Offline synthetic image benchmark smoke check (Linux 3.11)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python scripts/benchmark_v12.py > "$RUNNER_TEMP/jechulok-v12-bench.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "jechulok-v12-bench.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["status"] == "pass"
          assert data["files_retained"] is False
          assert data["personal_documents_processed"] is False
          cases = {x["case"]: x for x in data["cases"]}
          assert cases["generous_limit"]["encoding_attempts"] == 1
          assert cases["tight_limit"]["encoding_attempts"] > 1
          assert all(x["technical_status"] == "pass" for x in cases.values())
          print("Synthetic benchmark smoke OK")
          PY
      - name: Read-only setup doctor smoke check
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          import setup_mcp
          result = setup_mcp.environment_report(Path.cwd().resolve(), Path(sys.executable))
          assert result['status'] == 'pass', result
          assert result['config_modified'] is False
          print('Setup doctor smoke check OK')
          PY
      - name: Fresh venv install and real stdio MCP smoke (Linux 3.11)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        working-directory: .agents/skills/jechulok-submission
        run: |
          python scripts/setup_mcp.py install --allowed-dir "$PWD"
          python scripts/setup_mcp.py doctor --allowed-dir "$PWD"
          python scripts/setup_mcp.py probe --allowed-dir "$PWD"
          python scripts/setup_mcp.py status --allowed-dir "$PWD"
          python scripts/setup_mcp.py beta-check --allowed-dir "$PWD" > "$RUNNER_TEMP/jechulok-beta-check.json"
          python scripts/setup_mcp.py guide --allowed-dir "$PWD" --probe --format json > "$RUNNER_TEMP/jechulok-guided-v23.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "jechulok-guided-v23.json").read_text())
          assert data["status"] == "ready_for_client_config", data
          assert data["stage"] == 4
          assert data["network_used"] is False
          assert data["automatic_repair"] is False
          assert data["mcp_host_registration_verified"] is False
          print("v2.3 live local MCP onboarding guide OK")
          PY
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "jechulok-beta-check.json").read_text())
          assert data["status"] == "pass", data
          assert data["version"] == "2.5.0"
          assert data["tool_count"] == 20
          assert data["network_used"] is False
          assert data["documents_read"] is False
          assert data["client_configuration_changed"] is False
          print("v2.3 privacy-safe beta check OK")
          PY
          python scripts/setup_mcp.py config --client codex --allowed-dir "$PWD" > "$RUNNER_TEMP/jechulok-codex.toml"
          python - <<'PY'
          import asyncio
          import os
          import tomllib
          from pathlib import Path
          from mcp import Client, StdioServerParameters

          data = tomllib.loads((Path(os.environ["RUNNER_TEMP"]) / "jechulok-codex.toml").read_text())
          config = data["mcp_servers"]["jechulok"]
          assert Path(config["command"]).is_file()
          assert Path(config["args"][0]).is_file()

          async def verify():
              async with Client(StdioServerParameters(
                  command=config["command"],
                  args=config["args"],
                  env=config["env"],
              )) as client:
                  tools = await client.list_tools()
                  names = {tool.name for tool in tools.tools}
                  assert len(names) == 20, names
                  assert "verify_submission_package" in names
          asyncio.run(verify())
          print("Fresh isolated install, config, and MCP connection OK")
          PY
      - name: Verify Agent Skill frontmatter
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('SKILL.md').read_text()
          assert text.startswith('---\n')
          front = text.split('---',2)[1]
          assert 'name: jechulok-submission' in front
          assert 'description:' in front
          print('Skill frontmatter OK')
          PY
