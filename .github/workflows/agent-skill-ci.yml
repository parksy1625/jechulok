name: JeChulOK Agent Skill CI
on:
  push:
    paths:
      - '.agents/skills/jechulok-submission/**'
      - '.github/workflows/agent-skill-ci.yml'
  pull_request:
    paths:
      - '.agents/skills/jechulok-submission/**'
      - '.github/workflows/agent-skill-ci.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-release
  cancel-in-progress: true
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: .agents/skills/jechulok-submission
        run: python -m pip install -r requirements-mcp.txt
      - name: Verify dependency compatibility
        working-directory: .agents/skills/jechulok-submission
        run: python -m pip check
      - name: Compile source and tests
        working-directory: .agents/skills/jechulok-submission
        run: python -m compileall -q scripts tests
      - name: Run CLI + MCP + end-to-end release tests
        working-directory: .agents/skills/jechulok-submission
        run: python -m unittest discover -s tests -v
      - name: Evaluate 100 synthetic guidance scenarios (Linux 3.11)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python scripts/evaluate_v18.py --check > "$RUNNER_TEMP/jechulok-eval-v18.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "jechulok-eval-v18.json").read_text())
          assert data["dataset_type"] == "synthetic_only"
          assert data["evaluated_cases"] == 100
          assert data["passed_cases"] == 100, data["failures"]
          assert len(data["families"]) == 4
          assert data["real_world_accuracy"] is None
          print("100 synthetic cases passed; no real-world accuracy claims")
          PY
      - name: Upload inspectable v1.8 evaluation JSON
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' && always()
        uses: actions/upload-artifact@v4
        with:
          name: jechulok-eval-v18-synthetic
          path: ${{ runner.temp }}/jechulok-eval-v18.json
          if-no-files-found: error
          retention-days: 30
      - name: Offline synthetic image benchmark smoke check (Linux 3.11)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python scripts/benchmark_v12.py > "$RUNNER_TEMP/jechulok-v12-bench.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "jechulok-v12-bench.json"
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["status"] == "pass"
          assert data["files_retained"] is False
          assert data["personal_documents_processed"] is False
          cases = {x["case"]: x for x in data["cases"]}
          assert cases["generous_limit"]["encoding_attempts"] == 1
          assert cases["tight_limit"]["encoding_attempts"] > 1
          assert all(x["technical_status"] == "pass" for x in cases.values())
          print("Synthetic benchmark smoke OK")
          PY
      - name: Read-only setup doctor smoke check
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          import setup_mcp
          result = setup_mcp.environment_report(Path.cwd().resolve(), Path(sys.executable))
          assert result['status'] == 'pass', result
          assert result['config_modified'] is False
          print('Setup doctor smoke check OK')
          PY
      - name: Fresh venv install and real stdio MCP smoke (Linux 3.11)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        working-directory: .agents/skills/jechulok-submission
        run: |
          python scripts/setup_mcp.py install --allowed-dir "$PWD"
          python scripts/setup_mcp.py doctor --allowed-dir "$PWD"
          python scripts/setup_mcp.py probe --allowed-dir "$PWD"
          python scripts/setup_mcp.py status --allowed-dir "$PWD"
          python scripts/setup_mcp.py config --client codex --allowed-dir "$PWD" > "$RUNNER_TEMP/jechulok-codex.toml"
          python - <<'PY'
          import asyncio
          import os
          import tomllib
          from pathlib import Path
          from mcp import Client, StdioServerParameters

          data = tomllib.loads((Path(os.environ["RUNNER_TEMP"]) / "jechulok-codex.toml").read_text())
          config = data["mcp_servers"]["jechulok"]
          assert Path(config["command"]).is_file()
          assert Path(config["args"][0]).is_file()

          async def verify():
              async with Client(StdioServerParameters(
                  command=config["command"],
                  args=config["args"],
                  env=config["env"],
              )) as client:
                  tools = await client.list_tools()
                  names = {tool.name for tool in tools.tools}
                  assert len(names) == 20, names
                  assert "verify_submission_package" in names
          asyncio.run(verify())
          print("Fresh isolated install, config, and MCP connection OK")
          PY
      - name: Verify Agent Skill frontmatter
        working-directory: .agents/skills/jechulok-submission
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('SKILL.md').read_text()
          assert text.startswith('---\n')
          front = text.split('---',2)[1]
          assert 'name: jechulok-submission' in front
          assert 'description:' in front
          print('Skill frontmatter OK')
          PY
