name: JeChulOK v3.2 Read-only Preview Synthetic Audit
on:
  push:
    paths:
      - '.agents/skills/jechulok-submission/**'
      - '.github/workflows/preview-v32-ci.yml'
  pull_request:
    paths:
      - '.agents/skills/jechulok-submission/**'
      - '.github/workflows/preview-v32-ci.yml'
permissions:
  contents: read
jobs:
  preview-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local-only file processing dependencies
        working-directory: .agents/skills/jechulok-submission
        run: python -m pip install -r requirements.txt
      - name: Run synthetic preview audit
        working-directory: .agents/skills/jechulok-submission
        run: python scripts/preview_audit_v32.py --check > preview-v32.json
      - name: Check report privacy and no-write assertions
        working-directory: .agents/skills/jechulok-submission
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('preview-v32.json').read_text())
          assert data['status'] == 'pass', data
          assert data['scenario_count'] == data['passed_count'] == 6
          assert data['synthetic_only'] is True
          assert data['no_path_leaked'] is True
          assert data['user_documents_read'] is False
          assert data['production_files_written'] is False
          assert data['network_used'] is False
          assert data['uploads_performed'] is False
          PY
      - name: Upload synthetic preview audit
        uses: actions/upload-artifact@v4
        with:
          name: jechulok-v32-preview-synthetic
          path: .agents/skills/jechulok-submission/preview-v32.json
          if-no-files-found: error
          retention-days: 30
